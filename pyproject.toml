[project]
name = "premshop"
version = "0.1.0"
description = "PremShop — Persian digital-subscriptions shop (Django modular monolith)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sentry-sdk>=2.0",
    "jdatetime>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "time-machine>=2.15",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "playwright>=1.47",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import order, UP modern syntax, B bugbear (likely
# bugs), DJ Django-specific checks, S bandit-style security rules.
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = ["E501"]  # black owns line length

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]  # assert is the point of a test
"config/settings/*" = ["F403", "F405"]  # star-import is the settings convention

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["apps.*.tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# jdatetime ships no type information; we only use its date conversion.
module = ["jdatetime.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
addopts = "--strict-markers --tb=short"
markers = [
    "browser: drives the real page in Playwright Chromium; skips itself when no browser is installed",
]
testpaths = ["apps"]
