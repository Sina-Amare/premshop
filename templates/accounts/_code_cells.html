{% comment %}The six cells the shared code-cells.js lays over the form's code field. Hidden
until that script runs; without it the plain field is the form.{% endcomment %}
<div class="otp" id="code-cells" dir="ltr" hidden aria-hidden="true">
  <input type="text" class="otp__cell" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="رقم ۱">
  <input type="text" class="otp__cell" inputmode="numeric" maxlength="1" aria-label="رقم ۲" tabindex="-1">
  <input type="text" class="otp__cell" inputmode="numeric" maxlength="1" aria-label="رقم ۳" tabindex="-1">
  <input type="text" class="otp__cell" inputmode="numeric" maxlength="1" aria-label="رقم ۴" tabindex="-1">
  <input type="text" class="otp__cell" inputmode="numeric" maxlength="1" aria-label="رقم ۵" tabindex="-1">
  <input type="text" class="otp__cell" inputmode="numeric" maxlength="1" aria-label="رقم ۶" tabindex="-1">
</div>
