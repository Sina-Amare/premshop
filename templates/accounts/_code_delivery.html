<p class="small auth-sent" id="delivery-sms"{% if channel == "telegram" %} hidden{% endif %}>کد ورود ۶ رقمی با پیامک{% if phone %} به شماره‌ی <bdi dir="ltr">{{ phone }}</bdi>{% endif %} فرستاده شد و تا ۱۰ دقیقه اعتبار دارد.</p>
<p class="small auth-sent" id="delivery-telegram"{% if channel != "telegram" %} hidden{% endif %}>اگر حساب تلگرامتان به حساب کاربری متصل باشد، کد ورود را در <a href="{{ telegram_bot_url }}">ربات پرم‌شاپ</a> می‌بینید.{% if phone %}<br>شماره‌ی موبایل: <bdi dir="ltr">{{ phone }}</bdi>{% endif %}</p>
