{% load i18n %}
{% comment %}Unfold's sign-in title in ink: turquoise is the action on this page, and the title is not one.{% endcomment %}

<div class="border-b border-base-200 mb-8 pb-6 dark:border-base-800">
    <h1 class="font-semibold">
        {% if subtitle %}
            <span class="block text-font-important-light dark:text-font-important-dark">{{ subtitle }} </span>
        {% endif %}

        <span class="block font-semibold text-font-important-light text-xl dark:text-font-important-dark">{{ title }}</span>
    </h1>
</div>
