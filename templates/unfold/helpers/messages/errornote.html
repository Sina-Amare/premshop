{% load i18n %}
{% comment %}
One sentence whatever the count. Unfold's is a plural string Django's Persian
leaves empty, so the banner over every failed save was English.
{% endcomment %}
{% if errors %}
    <p class="errornote bg-red-100 mb-4 text-red-700 px-3 py-2.5 leading-[18px] rounded-default dark:bg-red-500/20 dark:border-red-500/20 dark:text-red-400 {% if class %} {{ class }}{% endif %}">
        {% translate "ذخیره نشد. خطاهای زیر را درست کنید." %}
    </p>
{% endif %}
