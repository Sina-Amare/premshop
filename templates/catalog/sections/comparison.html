  <h2 data-preview-field="title" class="pdp__h2">{{ section.title|default:section.get_kind_display|bdi }}</h2>
  <div class="rich__scroll" tabindex="0"><div data-preview-field="body"{% if snapshot and not section.body %} data-preview-empty hidden{% endif %} class="prose rich">{{ section.body|markdown }}</div></div>
  {% include "catalog/sections/_image.html" %}
</section>
