{% extends "base.html" %}

{% block title %}این صفحه فعلاً باز نمی‌شود{% endblock %}
{% block meta_robots %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<div class="wrap page">
<div class="auth-shell">
  <div class="card auth-card">
    <h1 class="auth-title">این صفحه فعلاً باز نمی‌شود</h1>
    <p class="prose auth-lead">مشکل از طرف ماست. کمی بعد دوباره امتحان کنید.</p>
    <a class="btn btn--secondary" href="{{ request.get_full_path }}">تلاش دوباره</a>
  </div>
  <p class="micro auth-aside">
    اگر ادامه داشت، به <a href="mailto:{{ support.email }}"><bdi dir="ltr">{{ support.email }}</bdi></a> ایمیل بزنید.
  </p>
</div>
</div>
{% endblock %}
