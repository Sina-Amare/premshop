<div class="sr-only" id="cart-announcement" role="status" aria-live="polite" aria-atomic="true"></div>
<aside class="cart-toast" id="cart-toast" aria-label="پیام سبد خرید" hidden>
  <div class="cart-toast__message"><span class="cart-toast__art"><img alt="" width="28" height="28" data-toast-image></span>{% include 'storefront/icon.html' with name='check' %}<p><strong data-toast-title></strong><span data-toast-detail hidden></span><span data-toast-total hidden></span></p></div>
  <a href="{% url 'cart' %}">مشاهده‌ی سبد{% include 'storefront/icon.html' with name='arrow' %}</a>
  <button type="button" data-toast-close aria-label="بستن پیام">{% include 'storefront/icon.html' with name='close' %}</button>
</aside>
