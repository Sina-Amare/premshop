<g class="cart-art__drop cart-art__drop--{{ k }}"><g transform="rotate({{ r }} {{ x|add:13 }} {{ y|add:13 }})"><rect x="{{ x }}" y="{{ y }}" width="26" height="26" rx="7" fill="#fff"/>{% if line.plan and line.plan.product.image %}<image href="{{ line.plan.product.image.url }}" x="{{ x|add:5 }}" y="{{ y|add:5 }}" width="16" height="16" preserveAspectRatio="xMidYMid meet"/>{% elif line.plan %}<text x="{{ x|add:13 }}" y="{{ y|add:18 }}" text-anchor="middle" font-size="13" font-weight="700" fill="#2459d3">{{ line.plan.product.name|slice:":1" }}</text>{% endif %}</g></g>
