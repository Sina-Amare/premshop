name: CI

on:
  # Every branch, not just main: a gate that only runs after merging is a
  # report, not a gate.
  push:
  pull_request:

# The jobs only read the repository; the tests they run get no token that can write.
permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight run obsolete; don't pay for both.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values. Real secrets never appear in CI for this project.
  SECRET_KEY: ci-only-not-a-real-secret
  DEBUG: "false"
  ALLOWED_HOSTS: localhost,127.0.0.1
  DATABASE_URL: postgres://premshop:premshop@localhost:5432/premshop_test
  DJANGO_SETTINGS_MODULE: config.settings.dev

jobs:
  lint:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff (likely bugs, imports, security patterns)
        run: uv run ruff check .
      - name: black (formatting is not a matter of opinion)
        run: uv run black --check .
      - name: mypy (types)
        run: uv run mypy apps config

  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        # A docs-only push still gets lint, the audit and a green run; it skips
        # the real-browser tests, most of the run, which cannot see Markdown. With
        # no usable base (a branch's first push), everything runs.
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qvE '^(docs/|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests (real PostgreSQL, real Chromium)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    services:
      # PostgreSQL exercises row locks, sequences and the production constraints.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: premshop
          POSTGRES_PASSWORD: premshop
          POSTGRES_DB: premshop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # app.css is not in git. Without this build the browser tests would read
      # unstyled pages, and contrast and layout would be checked against nothing.
      - name: CSS from source
        run: npm run css
      # The runner image already has Chrome's system libraries. --with-deps added
      # CJK and Thai fonts no page uses, and a slow mirror made that ten minutes.
      - name: Chromium for Playwright
        run: uv run playwright install chromium
      - name: No model change without its migration
        run: uv run python manage.py makemigrations --check --dry-run
      # One worker per core; pytest-django gives each its own test database and live server.
      - name: pytest
        run: uv run pytest -q -n auto
        env:
          # Here a browser test that cannot launch fails instead of skipping.
          REQUIRE_BROWSER: "1"

  image:
    name: Production image (built, run behind nginx)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A developer's build context holds these; the image must still not.
      - name: Plant the private files .dockerignore keeps out
        run: |
          mkdir -p docs-local backups media
          for path in .env .env.production docs-local/notes.md backups/premshop.dump media/upload.png; do
            echo "planted, never shipped" > "$path"
          done
      - name: Build premshop:${{ github.sha }}
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} --tag premshop:${{ github.sha }} .
      - name: Run the stack with production settings and check it through nginx
        run: bash deploy/smoke.sh premshop:${{ github.sha }} ${{ github.sha }}
      # scripts/deploy.py on the runner's system Python, as on the server.
      - name: Rehearse a deploy, its automatic return, a rollback and a restore
        run: bash deploy/rehearse.sh premshop:${{ github.sha }} ${{ github.sha }}

  audit:
    name: Dependency and security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pip-audit (known CVEs in dependencies)
        run: uv run pip-audit --skip-editable
      - name: bandit (insecure code patterns)
        run: uv run bandit -q -r apps config -x "*/tests/*"
