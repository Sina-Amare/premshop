# The one entry point: TLS ends here, and Django runs behind it with production
# settings. Included inside the http block of the image's nginx.conf.

# Delivery and tracking links carry the token that opens an order, so the log
# keeps their kind and drops the token. No query string or referrer is logged.
map $uri $loggable_uri {
    ~^/(?<kind>d|track)/ /$kind/[redacted]/;
    default $uri;
}

log_format premshop '$remote_addr [$time_local] "$request_method $loggable_uri" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';

server_tokens off;

server {
    listen 80;
    access_log /var/log/nginx/access.log premshop;
    error_log /var/log/nginx/error.log crit;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    access_log /var/log/nginx/access.log premshop;
    # An unreachable upstream is logged at "error" with the whole request line,
    # token and all; the access log already records each of those as a 503.
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 10m;

    # Docker's resolver, looked up per request, so nginx starts and answers
    # while web is down or being replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://web:8000;

    # Only when nginx cannot reach web; Django's own 503 pages pass through.
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /srv/maintenance;
        internal;
        add_header Cache-Control "no-store" always;
    }

    # The only compressed responses: static files carry no secret and no text a
    # visitor wrote, so their size cannot leak one (BREACH).
    location /static/ {
        root /srv;
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml application/json text/plain;
        add_header Cache-Control "public, max-age=3600";

        # A name carrying its content hash never changes, so it is never asked for again.
        location ~ "\.[0-9a-f]{12}\.[^./]+$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location /media/ {
        root /srv;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass $web;
        proxy_set_header Host $host;
        # Overwritten, never appended: what the visitor wrote in these is discarded.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }
}
